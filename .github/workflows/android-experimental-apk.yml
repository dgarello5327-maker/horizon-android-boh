name: Horizon Android experimental ARM64 APK
run-name: Horizon Android APK · ${{ github.sha }}

on:
  push:
    branches: [a54-optimization-hnmod-support]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'research-lock.json'
      - 'packaging/android/**'
      - 'tools/**'
      - 'mods/**'
      - 'third_party/**'
      - '.github/workflows/android-experimental-apk.yml'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'

permissions:
  contents: read

concurrency:
  group: horizon-android-experimental-arm64
  cancel-in-progress: true

jobs:
  build:
    name: Build optimized ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/ci-target
      HORIZON_TELEMETRY_URL: 'off'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.14'

      - name: Install Android SDK, NDK and Rust target
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          rustup target add aarch64-linux-android

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/ci-target
          key: horizon-android-arm64-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/android/build.gradle') }}-${{ github.sha }}
          restore-keys: |
            horizon-android-arm64-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/android/build.gradle') }}-

      - name: Check public source and packaging boundaries
        run: |
          python3 tools/check_public_tree.py
          python3 -m unittest discover -s tests -p 'test_android_release_audit.py'

      - name: Prepare verified engine inputs
        run: python3 tools/android_prepare.py

      - name: Create temporary CI signing key
        run: |
          mkdir -p .local/android
          keytool -genkeypair -keystore .local/android/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -validity 10000 -dname "CN=Horizon Experimental Android CI"
          chmod 600 .local/android/debug.keystore

      - name: Build optimized public ARM64 APK
        run: |
          python3 tools/android_build.py --abi arm64-v8a --public --profile release \
            --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME" --gradle "$(command -v gradle)" \
            --ndk-version 28.2.13676358 --build-tools-version 35.0.0 \
            --dev-build "${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:12}" \
            --dev-version-code "$((1000 + GITHUB_RUN_NUMBER))"

      - name: Collect APK and checksum
        run: |
          mkdir -p dist
          apk=.local/android/apk/arm64-v8a/horizon-android-public.apk
          test -s "$apk"
          cp "$apk" "dist/Horizon-Android-A54-arm64-${GITHUB_SHA:0:12}.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          cp ../LICENSE LICENSE.txt
          cp ../THIRD_PARTY_NOTICES.md .
          printf '{"commit":"%s","abi":"arm64-v8a","profile":"release","experimental":true}\n' "$GITHUB_SHA" > BUILD.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: horizon-android-a54-arm64-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing key
        if: always()
        run: rm -f .local/android/debug.keystore
