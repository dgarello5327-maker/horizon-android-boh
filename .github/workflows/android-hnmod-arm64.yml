name: Build Android ARM64 client with a native mod

on:
  workflow_dispatch:
    inputs:
      bundle_url:
        description: Public HTTPS download URL of the .hnmod bundle
        required: true
        type: string
      trust_native_code:
        description: Confirm that you trust this unsandboxed native mod
        required: true
        type: choice
        options:
          - no
          - yes
        default: no

permissions:
  contents: read

concurrency:
  group: android-hnmod-arm64
  cancel-in-progress: false

jobs:
  build:
    name: Compile Horizon + .hnmod for arm64-v8a
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ANDROID_NDK_VERSION: 28.2.13676358
      ANDROID_BUILD_TOOLS_VERSION: 35.0.0
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Require explicit native-code consent
        if: inputs.trust_native_code != 'yes'
        run: |
          echo "::error::The .hnmod contains unsandboxed native code. Re-run and explicitly select yes only if you trust this mod."
          exit 1

      - name: Check out Android fork
        uses: actions/checkout@v4
        with:
          ref: a54-optimization-hnmod-support
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and build tools
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "ndk;${ANDROID_NDK_VERSION}" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"
          yes | sdkmanager --licenses >/dev/null

      - name: Set up Rust for Android ARM64
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: aarch64-linux-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Apply native mixins and compile the ARM64 APK
        env:
          HNMOD_URL: ${{ inputs.bundle_url }}
        run: |
          python tools/android_native_build.py \
            --bundle-url "$HNMOD_URL" \
            --trust-native-code \
            --sdk "$ANDROID_HOME" \
            --java-home "$JAVA_HOME" \
            --gradle "$(command -v gradle)" \
            --ndk-version "$ANDROID_NDK_VERSION" \
            --build-tools-version "$ANDROID_BUILD_TOOLS_VERSION"

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: horizon-android-hnmod-arm64
          path: horizon-android-hnmod-arm64.apk
          if-no-files-found: error
          retention-days: 14
