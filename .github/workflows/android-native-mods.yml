name: Android native mod import checks

on:
  pull_request:
    branches: [android]
    paths:
      - "crates/horizon-client/src/content_files.rs"
      - "crates/horizon-client/src/android/catalog.rs"
      - "crates/horizon-client/src/android/documents.rs"
      - "crates/horizon-client/src/android/launcher_pages.rs"
      - "crates/horizon-mods/**"
      - "tools/test_android_content.py"
      - "tools/android_native_build.py"
      - "tools/test_android_native_build.py"
      - ".github/workflows/android-hnmod-arm64.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-native-mods.yml"
  push:
    branches: [a54-optimization-hnmod-support]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-mod-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-native-bundles:
    name: Validate native bundle parser and Android import
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test ARM64 native bundle build input validation
        run: python3 tools/test_android_native_build.py

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test upstream native bundle validation
        run: cargo test -p horizon-mods --features index

      - name: Test Android add-on archive validation
        run: cargo test -p horizon-client --no-default-features content_files::tests::validates_structure_paths_metadata_and_cancellation

  check-arm64:
    name: Type-check Android ARM64 integration
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HORIZON_TELEMETRY_URL: "off"
      CARGO_TARGET_DIR: .local/ci-target
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Android toolchain
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;28.2.13676358" "build-tools;35.0.0"
          rustup target add aarch64-linux-android

      - name: Check Android Rust code
        run: python3 tools/android_build.py --abi arm64-v8a --check --public --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME_17_X64" --ndk-version 28.2.13676358 --build-tools-version 35.0.0
